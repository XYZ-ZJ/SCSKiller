name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows 11 Portable
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Proxy (CMake, MSVC, Release x64)
        shell: cmd
        run: cmake -S proxy -B proxy/build -A x64 && cmake --build proxy/build --config Release -- /m

      - name: Build
        run: dotnet build SCSKiller.slnx -c Release

      - name: Publish
        shell: powershell
        run: |
          ./build/publish.ps1 -NoOodle -Version 1.4.3
          $dist = (Resolve-Path dist).Path
          $sums = Get-ChildItem dist -Recurse -File -Exclude SHA256SUMS-unsigned.txt | Sort-Object FullName | ForEach-Object {
              "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.FullName.Substring($dist.Length + 1).Replace('\', '/')
          }
          [IO.File]::WriteAllText("$dist\SHA256SUMS-unsigned.txt", ($sums -join "`n") + "`n")

      - name: Package Velopack Portable
        shell: powershell
        run: |
          dotnet tool install -g vpk
          vpk pack -u SCSKiller -v 1.4.3 -p dist/SCSKiller -e SCSKiller.exe -o dist/releases
          Get-ChildItem dist/releases
          $portZip = Get-ChildItem dist/releases -Filter "*Portable*.zip" | Select-Object -First 1
          if ($portZip) {
              Copy-Item $portZip.FullName dist/SCSKiller-Portable.zip -Force
              Write-Host "Windows Portable package created: $($portZip.FullName)"
          } else {
              Write-Error "Portable zip not found in dist/releases!"
              exit 1
          }

      - name: Upload Windows 11 Portable Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SCSKiller-Portable
          path: dist/SCSKiller-Portable.zip
          retention-days: 7
          if-no-files-found: error
